<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đèn Kéo Quân 3D - Bài 19</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #1a1a1a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 20px;
        }
        h1 {
            margin-bottom: 10px;
            color: #ffcc00;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.7);
        }
        .container {
            perspective: 1000px; /* Tạo không gian 3D */
            margin-top: 80px;
            margin-bottom: 80px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Khung đèn kéo quân */
        .carousel {
            width: 200px;
            height: 250px;
            position: relative;
            transform-style: preserve-3d;
            /* Kích hoạt animation quay tròn */
            animation: spin 15s infinite linear; 
            transition: animation-play-state 0.3s ease;
        }
        /* Hiệu ứng quay tròn tự động */
        @keyframes spin {
            from { transform: rotateY(0deg); }
            to { transform: rotateY(360deg); }
        }
        /* Lớp JavaScript sẽ tương tác để dừng/chạy */
        .paused {
            animation-play-state: paused !important;
        }
        /* Định dạng chung cho 6 mặt */
        .carousel-item {
            position: absolute;
            width: 200px;
            height: 250px;
            left: 0;
            top: 0;
            border: 4px solid #ffcc00;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.5);
            overflow: hidden;
            background: #222;
            transition: transform 0.5s ease, filter 0.3s;
        }
        .carousel-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* Làm nổi bật mặt đang được rê chuột vào */
        .carousel-item:hover {
            filter: brightness(1.2);
            cursor: pointer;
        }
        /* Tọa độ 3D cho từng mặt (6 mặt => mỗi mặt lệch nhau 60 độ)
           Khoảng cách dịch chuyển tịnh tiến (translateZ) tính bằng công thức: r = w / (2 * tan(30deg)) 
           Với w = 200px => translateZ ≈ 173px */
        .item1 { transform: rotateY(0deg) translateZ(173px); }
        .item2 { transform: rotateY(60deg) translateZ(173px); }
        .item3 { transform: rotateY(120deg) translateZ(173px); }
        .item4 { transform: rotateY(180deg) translateZ(173px); }
        .item5 { transform: rotateY(240deg) translateZ(173px); }
        .item6 { transform: rotateY(300deg) translateZ(173px); }

        /* Khu vực hiển thị kết quả Bài tập 18 */
        .assignment-18 {
            margin-top: 20px;
            max-width: 600px;
            text-align: center;
            background: #2a2a2a;
            padding: 20px;
            border-radius: 10px;
            border: 1px dashed #ffcc00;
        }
        .assignment-18 img {
            width: 100%;
            max-width: 500px;
            margin-top: 15px;
            border-radius: 5px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .back-btn {
            margin-top: 25px;
            padding: 10px 20px;
            background-color: #ffcc00;
            color: #1a1a1a;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .back-btn:hover {
            background-color: #fff;
        }
    </style>
</head>
<body>

    <h1>🏮 ĐÈN KÉO QUÂN 🏮</h1>
    <p style="color: #aaa;">Rê chuột vào một hình bất kỳ để dừng đèn, bỏ chuột ra để quay tiếp.</p>

    <div class="container">
        <div class="carousel" id="lamp">
            <div class="carousel-item item1"><img src="images/anh1.jpg" alt="Ảnh 1"></div>
            <div class="carousel-item item2"><img src="images/anh2.jpg" alt="Ảnh 2"></div>
            <div class="carousel-item item3"><img src="images/anh3.jpg" alt="Ảnh 3"></div>
            <div class="carousel-item item4"><img src="images/anh4.jpg" alt="Ảnh 4"></div>
            <div class="carousel-item item5"><img src="images/anh5.jpg" alt="Ảnh 5"></div>
            <div class="carousel-item item6"><img src="images/anh6.jpg" alt="Ảnh 6"></div>
        </div>
    </div>

    <div class="assignment-18">
        <h3>📊 Kết quả Bài tập 18 </h3>
        <p>Dưới đây là hình ảnh kết quả bài tập trắc nghiệm.</p>
        <img src="images/tracnghiem-bai18.jpg" alt="Kết quả trắc nghiệm bài 18">
    </div>

    <a href="index.html" class="back-btn">⬅ Quay lại Portfolio (Bài 17.3)</a>

    <script>
        const lamp = document.getElementById('lamp');

        // Khi di chuột vào bất kỳ phần nào của đèn -> Dừng quay
        lamp.addEventListener('mouseenter', () => {
            lamp.classList.add('paused');
        });

        // Khi rê chuột ra ngoài -> Tiếp tục quay
        lamp.addEventListener('mouseleave', () => {
            lamp.classList.remove('paused');
        });
    </script>
</body>
</html>
